name: CI

on:
  # push:
  #   branches:
  #     - main
  #     - develop
  # pull_request:
  #   branches:
  #     - main
  #     - develop
  workflow_dispatch:
    inputs:
      DEPLOY_BRANCH:
        description: "发布的分支"
        type: string
        default: "develop"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.3"
          cache: "pnpm"

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 代码格式检查
        run: pnpm run prettier

      # - name: TypeScript 类型检查
      #   run: npx tsc --noEmit

      - name: 构建项目
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: 部署到 GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Deploy ${{ github.ref_name }}"
